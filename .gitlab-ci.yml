workflow:
  rules:
    # Run on pushes to main and version tags; skip draft MRs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_BUILDKIT: "1"

stages:
  - test
  - build
  - publish

# ── Tests ──────────────────────────────────────────────────────────────────────

unit-tests:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
    - npm ci
  script:
    - npm run test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Build ──────────────────────────────────────────────────────────────────────

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --cache-from "$IMAGE:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$IMAGE:latest" \
        .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Publish (tagged releases) ──────────────────────────────────────────────────

publish-release:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Re-tag the already-pushed SHA image with the semver tag (no rebuild)
    - docker pull "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag  "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:$CI_COMMIT_TAG"
  needs:
    - build-image
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
