workflow:
  rules:
    # Run on pushes to main and version tags; skip draft MRs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/

variables:
  # Override REGISTRY in CI/CD settings → Settings → CI/CD → Variables
  # e.g. registry.example.com/mygroup/pandoc-nextjs-server
  REGISTRY: ${CI_REGISTRY}
  IMAGE_NAME: ${REGISTRY}/${CI_PROJECT_PATH}
  # Use the built-in GitLab registry credentials by default;
  # override REGISTRY_USER / REGISTRY_PASSWORD for an external registry
  REGISTRY_USER: ${CI_REGISTRY_USER}
  REGISTRY_PASSWORD: ${CI_REGISTRY_PASSWORD}
  # Docker BuildKit for faster, more efficient builds
  DOCKER_BUILDKIT: "1"

stages:
  - test
  - build
  - publish

# ── Tests ──────────────────────────────────────────────────────────────────────

unit-tests:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
    - npm ci
  script:
    - npm run test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Build ──────────────────────────────────────────────────────────────────────

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "${REGISTRY_PASSWORD}" | docker login ${REGISTRY} -u "${REGISTRY_USER}" --password-stdin
  script:
    # Build and tag with both the short commit SHA and a cache-busting latest
    - |
      docker build \
        --cache-from "${IMAGE_NAME}:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        -t "${IMAGE_NAME}:latest" \
        .
    - docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_NAME}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Publish (tagged releases) ──────────────────────────────────────────────────

publish-release:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "${REGISTRY_PASSWORD}" | docker login ${REGISTRY} -u "${REGISTRY_USER}" --password-stdin
  script:
    # Re-tag the already-pushed SHA image with the semver tag (no rebuild)
    - docker pull "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker tag  "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_NAME}:${CI_COMMIT_TAG}"
    - docker push "${IMAGE_NAME}:${CI_COMMIT_TAG}"
  needs:
    - build-image
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
